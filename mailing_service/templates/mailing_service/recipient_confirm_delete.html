{% extends 'mailing_service/base.html' %}
{% block title %} Подтвердите удаление {% endblock %}
{% block content %}
<div class="container">
    <div class="row">
        <div class="col-6">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <p class="card-text">Вы действительно хотите удалить получателя? <em>{{object.full_name}}</em>?</p>
                    <div class="card-body">
                        {% csrf_token %}
                    </div>
                    <div class="card-footer d-flex gap-2">
                        <button type="submit" class="btn btn-danger">
                            Удалить
                        </button>
                        <a class="btn btn-secondary" href="{% url 'mailing_service:recipient_list' %}" role="button">Отменить</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
